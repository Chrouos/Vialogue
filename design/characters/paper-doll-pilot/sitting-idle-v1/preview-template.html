<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vialogue 坐姿試稿</title>
<style>*{box-sizing:border-box}body{margin:0;color:#49443c;background:#f4efe5;font:16px/1.6 system-ui,"Microsoft JhengHei",sans-serif}main{max-width:1328px;margin:24px auto;padding:24px}h1{font-size:23px;font-weight:550;margin:0}p{color:#766e61;margin:6px 0 18px}.scene{position:relative;border-radius:12px;overflow:hidden;background:#e8d6ba}#scene{display:block;width:100%;height:auto;image-rendering:pixelated}.controls{display:flex;gap:12px;align-items:center;margin:16px 0;flex-wrap:wrap}button{font:inherit;padding:7px 18px;border:1px solid #cbc2b2;background:#fffaf0;color:inherit;border-radius:8px;cursor:pointer}.detail{display:flex;align-items:center;justify-content:center;gap:32px;background:#eee7da;border-radius:12px;flex-wrap:wrap;padding:16px}#detail{width:384px;height:480px;max-width:100%;object-fit:contain;image-rendering:pixelated}small{color:#766e61}#status{min-width:85px}@media(max-width:600px){main{margin:0;padding:14px}.detail{gap:8px}}</style>
<main><h1>在海邊坐一會兒</h1><p>短偏分・咖啡色・T-shirt＋牛仔褲。坐姿與待機動作試稿。</p><div class="scene"><canvas id="scene" width="1280" height="720" aria-label="海灘坐姿動態預覽"></canvas></div><div class="controls"><button id="pause">暫停</button><button id="step">逐格查看</button><span id="status"></span><a href="sitting-idle.gif" download>下載透明 GIF</a></div><div class="detail"><canvas id="detail" width="128" height="160" aria-label="放大人物預覽"></canvas><div><p>輕微呼吸、偶爾眨眼。<br>下半身與撐地的手維持原位。</p><small>目前為單一造型試稿；尚未製作坐下過程與其他造型。<br>場景是動作與比例預覽，未接入遊戲房間或收信規則。</small></div></div></main>
<script id="data" type="application/json">__DATA__</script><script>
const data=JSON.parse(document.getElementById('data').textContent),scene=document.getElementById('scene'),ctx=scene.getContext('2d'),detail=document.getElementById('detail'),dc=detail.getContext('2d');ctx.imageSmoothingEnabled=false;dc.imageSmoothingEnabled=false;
let images=[],background,index=0,paused=false,timer=null;
function load(src){return new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=src;});}
function draw(){ctx.drawImage(background,0,0,1280,720);ctx.fillStyle='rgba(68,48,40,.18)';ctx.beginPath();ctx.ellipse(633,618,35,6,0,0,Math.PI*2);ctx.fill();ctx.drawImage(images[index],570,475);dc.clearRect(0,0,128,160);dc.drawImage(images[index],0,0);document.getElementById('status').textContent=`${index+1} / ${images.length}`;}
function schedule(){clearTimeout(timer);if(!paused)timer=setTimeout(()=>{index=(index+1)%images.length;draw();schedule();},data.durations[index]);}
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'繼續':'暫停';schedule();};
document.getElementById('step').onclick=()=>{paused=true;clearTimeout(timer);document.getElementById('pause').textContent='繼續';index=(index+1)%images.length;draw();};
(async()=>{[background,...images]=await Promise.all([data.background,...data.frames].map(load));draw();schedule();})();
</script></html>
