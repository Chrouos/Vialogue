", "z": 60, "required": false, "default": null, "variants": []}, {"id": "accessory", "label": "飾品", "z": 70, "required": false, "default": null, "variants": []}, {"id": "hat", "label": "帽子", "z": 80, "required": false, "default": null, "variants": []}]}</script>
<script>
'use strict';
const catalog=JSON.parse(document.getElementById('catalog').textContent);
const canvas=document.getElementById('sprite'),ctx=canvas.getContext('2d');
canvas.width=catalog.canvas.width;canvas.height=catalog.canvas.height;ctx.imageSmoothingEnabled=false;
const slots=[...catalog.slots].sort((a,b)=>a.z-b.z),selection=new Map(),cache=new Map();let revision=0;
function load(variant){if(!cache.has(variant._src))cache.set(variant._src,new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>reject(new Error('圖片載入失敗：'+variant.label));image.src=variant._src;}));return cache.get(variant._src);}
async function draw(){const ticket=++revision;try{const layers=[];for(const slot of slots){const chosen=selection.get(slot.id);if(chosen==null)continue;const variant=slot.variants.find(v=>v.id===chosen);layers.push({image:await load(variant),variant});}if(ticket!==revision)return;ctx.clearRect(0,0,canvas.width,canvas.height);for(const {image,variant} of layers){const offset=variant.offset||[0,0];ctx.globalAlpha=variant.opacity??1;ctx.drawImage(image,offset[0],offset[1]);}ctx.globalAlpha=1;document.getElementById('error').textContent='';}catch(error){document.getElementById('error').textContent=error.message;}}
function addControl(id,text,options){const label=document.createElement('label');label.textContent=text;label.htmlFor=id;const select=document.createElement('select');select.id=id;for(const item of options){const option=document.createElement('option');option.value=item.id;option.textContent=item.label;select.append(option);}document.getElementById('controls').append(label,select);return {label,select};}
for(const slot of slots){
  selection.set(slot.id,slot.default??null);if(!slot.variants.length)continue;
  const options=slot.required?[...slot.variants]:[{id:'',label:'不使用'},...slot.variants];
  const {label,select}=addControl('slot-'+slot.id,slot.label,options);select.value=slot.default??'';
  const axes=[];
  // Optional selector metadata describes independent choices. The renderer still
  // consumes the same PNG variant ID, including custom variants without axes.
  for(const axis of slot.selectors||[]){
    const control=addControl('axis-'+slot.id+'-'+axis.key,axis.label,axis.options).select;
    axes.push({axis,control});
    control.addEventListener('change',()=>{
      const chosen=Object.fromEntries(axes.map(a=>[a.axis.key,a.control.value]));
      const variant=slot.variants.find(v=>v.selection&&axes.every(a=>v.selection[a.axis.key]===chosen[a.axis.key]));
      if(!variant){document.getElementById('error').textContent='這組搭配尚未提供素材。';return;}
      select.value=variant.id;select.dispatchEvent(new Event('change'));
    });
  }
  function sync(){const current=slot.variants.find(v=>v.id===select.value);for(const {axis,control} of axes)control.value=current?.selection?.[axis.key]??'';}
  if(axes.length){
    // Keep the complete variant control accessible for future imported variants;
    // move it below the primary selectors so everyday changes use separate axes.
    label.textContent='完整款式（含新增素材）';const details=document.createElement('details');
    const summary=document.createElement('summary');summary.textContent='其他款式';details.append(summary,label,select);document.getElementById('controls').append(details);
  }
  select.addEventListener('change',()=>{selection.set(slot.id,select.value||null);sync();draw();});sync();
}
document.getElementById('coverage').textContent=catalog.scope_note||'';
document.getElementById('download').addEventListener('click',async()=>{await draw();const link=document.createElement('a');link.download='vialogue-character.png';link.href=canvas.toDataURL('image/png');link.click();});
draw();
</script></html>
